# ===========================================================================
# Perfil de produccion (Render / Railway + Neon o Supabase)
#
# Se activa con SPRING_PROFILES_ACTIVE=prod. Todo sale del entorno del
# proveedor: DATABASE_URL la traduce CloudDatabaseUrl antes de arrancar, y
# PORT lo impone la plataforma.
# ===========================================================================

spring:
  # En produccion no hay fichero .env: las variables vienen del proveedor.
  config:
    import: ""

  datasource:
    hikari:
      pool-name: organon-pool
      # Los tiers gratuitos de Neon y Supabase limitan mucho las conexiones
      # concurrentes, y agotarlas tumba la aplicacion entera.
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
      connection-timeout: 20000
      # Por debajo del corte por inactividad del proveedor, para no quedarse
      # con conexiones que el servidor ya cerro.
      idle-timeout: 120000
      max-lifetime: 900000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # La primera vez sobre una base cloud vacia no hay historial que respetar.
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  # Render y Vercel van detras de un proxy: sin esto las URLs generadas
  # saldrian con http y el host interno.
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

organon:
  ai:
    # Ollama corre en la maquina del lector, no en Render. El asistente queda
    # apagado y la interfaz lo comunica sin romperse.
    enabled: ${ORGANON_AI_ENABLED:false}
  cors:
    # El dominio de Vercel, separado por comas si hay varios.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  seed:
    # La semilla es material de demostracion: fuera por defecto en produccion.
    enabled: ${ORGANON_SEED_ENABLED:false}

logging:
  level:
    root: INFO
    studio.organon.server: INFO

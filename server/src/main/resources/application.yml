spring:
  application:
    name: organon-server

  # Carga nativa de server/.env (formato properties). `optional:` evita fallar
  # en produccion, donde las variables llegan del entorno del proveedor cloud.
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/organon_local_db}
    username: ${SPRING_DATASOURCE_USERNAME:organon_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      pool-name: organon-pool
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    # El esquema lo posee Flyway. Hibernate solo valida que coincida.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Un modelo local generando en CPU tarda de sobra mas que el valor por
  # defecto, y el timeout engana: la peticion revienta justo cuando el modelo
  # iba a terminar, de modo que parece que Ollama falla.
  http:
    clients:
      connect-timeout: 10s
      read-timeout: ${ORGANON_AI_TIMEOUT:300s}

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # Nunca descargar modelos al arrancar. Es el valor por defecto, pero se
        # deja explicito: lo contrario bloquearia el primer arranque tirando
        # gigabytes sin que nadie lo haya pedido.
        pull-model-strategy: never
      # Spring AI 2 aplana las opciones: la forma con "options." esta obsoleta
      # y su metadata apunta a estas. Los tiempos de espera no viven aqui, sino
      # en spring.http.clients, que es el cliente que Spring AI reutiliza.
      chat:
        model: ${OLLAMA_MODEL:gemma4:12b}
        # Analisis, no prosa creativa: interesa que el desglose sea estable.
        temperature: 0.3
      embedding:
        # Multilingue y pequeno (622 MB). Solo se usa si esta descargado
        # (`ollama pull embeddinggemma`); sin el, se busca solo por palabras.
        model: ${OLLAMA_EMBEDDING_MODEL:embeddinggemma}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

organon:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    enabled: ${ORGANON_AI_ENABLED:true}
  seed:
    # Apagada por defecto: el cuaderno se llena leyendo, no arrancando. Para
    # recuperar el debate de ejemplo, ORGANON_SEED_ENABLED=true (es idempotente).
    enabled: ${ORGANON_SEED_ENABLED:false}
  search:
    # Al arrancar se indexa por significado lo que falte, en segundo plano.
    reindex-on-startup: ${ORGANON_SEARCH_REINDEX_ON_STARTUP:true}
    # Calibrado con embeddinggemma y sus prefijos sobre notas en espanol: lo
    # relevante quedaba entre 0,21 y 0,45, y lo ajeno por debajo de 0,17. El
    # corte relativo descarta lo que no llega a la mitad del mejor resultado.
    min-similarity: 0.2
    relative-similarity: 0.5

logging:
  level:
    studio.organon.server: DEBUG
